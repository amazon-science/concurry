name: tests

on:
  push:
    branches: [ "mainline" ]
  pull_request:
    branches: [ "mainline" ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "single-process"
            execution-modes: "sync,asyncio,thread"
          - name: "multiprocess"
            execution-modes: "process"
          - name: "ray"
            execution-modes: "ray"

    name: "tests (${{ matrix.name }})"

    steps:
      - name: Check out concurry repo
        uses: actions/checkout@v4
        with:
          path: concurry

      - name: Check out morphic repo
        uses: actions/checkout@v4
        with:
          repository: adivekar-utexas/morphic
          path: morphic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade uv
          python -m uv pip install --upgrade pytest pytest-xdist pytest-timeout
          python -m uv pip install -e "./morphic[all]"
          python -m uv pip install -e "./concurry[all]"

      - name: Run tests (${{ matrix.name }})
        timeout-minutes: 50
        env:
          CI: true
        run: |
          cd concurry
          pytest tests --verbose -m "not performance" --timeout=300 --timeout-method=thread --execution-modes=${{ matrix.execution-modes }}
